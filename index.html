<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FREE · 四级单词</title>
<link rel="manifest" href="./manifest.json">

<!-- iOS Safari 专用：让"添加到主屏幕"也像 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FREE CET4">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* SECTION: tokens */
:root{
  --fg:255,255,255;
  --bg:#000;
  --card:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.18);
  --hi:rgba(255,255,255,1);
  --md:rgba(255,255,255,.72);
  --lo:rgba(255,255,255,.58);
  --xlo:rgba(255,255,255,.4);
  --fill:rgba(255,255,255,.82);
  --track:rgba(255,255,255,.15);
  color-scheme:dark;
}
html[data-theme="light"]{
  --fg:17,17,19;
  --bg:#f4f4f2;
  --card:rgba(17,17,19,.05);
  --line:rgba(17,17,19,.22);
  --hi:rgba(17,17,19,1);
  --md:rgba(17,17,19,.74);
  --lo:rgba(17,17,19,.62);
  --xlo:rgba(17,17,19,.46);
  --fill:rgba(17,17,19,.85);
  --track:rgba(17,17,19,.16);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);color:var(--hi);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-weight:300;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
button,input{font-family:inherit;font-weight:inherit;color:inherit;}
button{letter-spacing:.02em;}
input{background:none;border:none;outline:none;}
em{font-style:normal;}
::placeholder{color:var(--xlo);}
[disabled]{opacity:.28;cursor:default;}
/* SECTION: shell */
.app{
  position:relative;width:100%;max-width:430px;height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
}
@media (min-width:620px) and (min-height:720px){
  body{background:#0a0a0b;}
  html[data-theme="light"] body{background:#d9d9d5;}
  .app{height:min(900px,94dvh);border-radius:30px;border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.5);}
}
/* SECTION: bar */
.bar{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px 4px;min-height:44px;gap:12px;}
.idn{display:flex;align-items:center;gap:10px;min-width:0;}
.avatar{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:none;background:none;padding:0;cursor:pointer;color:var(--md);}
.avatar svg{display:block;width:100%;height:100%;}
.uname{font-size:15px;color:var(--md);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;cursor:pointer;}
.uname2{font-size:16px;color:var(--hi);margin-top:10px;letter-spacing:.02em;}
.bsearch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--hi);font-size:15px;}
.capsule{display:flex;align-items:center;gap:6px;color:var(--lo);}
.cap{border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:11px;letter-spacing:1px;color:var(--lo);}
.dotline{position:relative;flex:0 0 auto;border-top:1px dashed var(--line);}
.dotline::before{content:"";position:absolute;left:-2.5px;top:-2.5px;width:4px;height:4px;border-radius:50%;border:1px solid var(--line);}
.vline{position:relative;flex:0 0 auto;width:0;border-left:1px dashed var(--line);}
.vline::before{content:"";position:absolute;top:-1px;left:-2.5px;width:4px;height:4px;border-radius:50%;border:1px solid var(--line);}
svg.ic{display:block;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;}
.iconbtn{background:none;border:none;padding:8px;cursor:pointer;color:var(--md);display:flex;}
.iconbtn:active{color:var(--hi);}
/* SECTION: screens */
.screen{flex:1 1 auto;display:none;flex-direction:column;min-height:0;}
.screen.on{display:flex;}
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
/* SECTION: home */
.home{display:flex;flex-direction:column;justify-content:space-evenly;gap:0;padding:6px 20px 10px;min-height:100%;}
.stat{cursor:pointer;}
.stat .anno{display:flex;flex-direction:column;align-items:center;opacity:0;height:0;overflow:hidden;transition:opacity .3s ease,height .3s ease;}
.stat .anno span{font-size:14px;color:var(--hi);letter-spacing:.06em;font-weight:400;}
.stat .lbl{font-size:clamp(15px,4.4vw,19px);color:var(--md);letter-spacing:.08em;transition:color .3s ease;margin-top:2px;}
.stat .num{font-size:clamp(56px,16vw,100px);line-height:1.04;font-weight:200;letter-spacing:.01em;color:var(--md);transition:color .3s ease;}
.stat.focus .anno{opacity:1;}
.stat.focus .lbl,.stat.focus .num{color:var(--hi);}
.home.has-focus .stat:not(.focus) .lbl,.home.has-focus .stat:not(.focus) .num{color:rgba(var(--fg),.5);}
/* SECTION: tabbar */
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-end;padding:10px 6px calc(10px + env(safe-area-inset-bottom));gap:4px;}
.tab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--xlo);padding:0 4px;min-width:0;flex:1 1 0;}
.tab .tt{font-size:clamp(11px,3.1vw,13px);letter-spacing:.02em;color:var(--md);white-space:nowrap;}
.tab .vline{height:26px;margin:6px 0 8px;}
.tab.on{color:var(--hi);}
.tab.on .tt{color:var(--hi);}
/* SECTION: pages */
.page{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;}
.page.on{display:flex;animation:fadein .26s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.ptitle{font-size:15px;color:var(--hi);letter-spacing:.04em;}
.phead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;gap:10px;}
/* SECTION: word card */
.card{display:flex;flex-direction:column;align-items:center;flex:1 1 auto;min-height:0;padding:4px 22px calc(20px + env(safe-area-inset-bottom));justify-content:flex-start;gap:clamp(8px,1.7vh,18px);overflow-y:auto;}
.cardtop{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.hint{font-size:13px;color:var(--hi);letter-spacing:.05em;min-height:18px;text-align:center;}
.hint.soft{color:var(--md);}
.widx{font-size:20px;color:var(--md);font-weight:200;letter-spacing:.04em;margin-top:2px;}
.word{font-size:clamp(38px,12.5vw,72px);font-weight:200;line-height:1.08;color:var(--hi);text-align:center;word-break:break-word;max-width:100%;transition:color .3s ease;}
.word.dim{color:rgba(var(--fg),.38);}
.phon{font-size:15px;color:var(--lo);margin-top:6px;transition:color .3s ease;}
.phon.dim{color:rgba(var(--fg),.34);}
.def{font-size:clamp(16px,4.6vw,21px);color:var(--hi);text-align:center;margin-top:12px;line-height:1.5;max-width:100%;transition:color .3s ease;}
.def.dim{color:rgba(var(--fg),.38);}
.corelab{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.lab{font-size:14px;color:var(--hi);letter-spacing:.07em;}
.lab.ghost{color:var(--md);}
.derbox{border-radius:18px;padding:14px 12px;border:1px dashed transparent;flex:0 0 auto;margin:0 auto;transition:border-color .3s ease;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:330px;}
.derbox.q{border-color:var(--line);}
.prompt{font-size:15px;line-height:1.75;color:var(--hi);text-align:center;letter-spacing:.02em;}
.promptcn{font-size:12.5px;line-height:1.75;color:var(--md);text-align:center;}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:14px;}
.opt{border:1px dashed var(--line);background:none;border-radius:12px;padding:11px 10px;font-size:13px;line-height:1.4;color:var(--md);cursor:pointer;text-align:left;min-height:44px;word-break:break-word;}
.opt.right{border-style:solid;border-color:var(--hi);color:var(--hi);}
.opt.wrong{border-color:var(--xlo);color:var(--xlo);text-decoration:line-through;}
.opt:disabled{cursor:default;}
.der{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;width:100%;max-width:320px;}
.der span{font-size:16px;color:rgba(var(--fg),.44);letter-spacing:.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s ease;}
.derbox.q .der span{color:var(--hi);}
.cardfoot{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;padding-top:6px;}
.cardfoot .hint{line-height:1.5;padding-bottom:5px;}
.cardfoot .minirow{padding-bottom:2px;}
.heart{color:var(--xlo);cursor:pointer;background:none;border:none;padding:8px;display:flex;transition:color .25s ease;}
.heart.on{color:var(--hi);}
.heart.on svg{fill:currentColor;}
.minirow{display:flex;gap:clamp(12px,4.5vw,24px);align-items:center;color:var(--lo);margin-top:4px;}
.minirow button{background:none;border:none;cursor:pointer;padding:6px;color:inherit;display:flex;align-items:center;}
.minirow button:active{color:var(--hi);}
.minirow button.txt{font-size:12px;letter-spacing:.06em;padding:5px 10px;border:1px dashed var(--line);border-radius:10px;color:var(--md);}
.minirow button.txt.on{color:var(--hi);border-style:solid;}
.swipehint{position:absolute;left:0;right:0;bottom:104px;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2;}
.swipehint .ar{margin-bottom:2px;}
.swipehint .ar{font-size:14px;color:var(--hi);line-height:1;}
.swipehint .tx{font-size:13px;color:var(--hi);letter-spacing:.04em;}
@media (max-height:700px){
  .card{gap:7px;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .word{font-size:clamp(30px,10vw,48px);}
  .def{font-size:clamp(15px,4.2vw,18px);margin-top:7px;}
  .der{gap:8px 14px;}
  .derbox{padding:10px 10px;}
  .opts{margin-top:10px;gap:8px;}
  .hint{min-height:16px;}
  .tab .vline{height:18px;margin:5px 0 6px;}
}
/* SECTION: rows / chips / seg */
.grp{background:var(--card);border-radius:18px;overflow:hidden;margin-top:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--track);cursor:pointer;}
.row:last-child{border-bottom:none;}
.row .k{font-size:15px;color:var(--hi);letter-spacing:.02em;}
.row .v{font-size:13px;color:var(--lo);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.sub{font-size:12px;color:rgba(var(--fg),.8);letter-spacing:.02em;margin-top:4px;}
.lvl{font-size:11px;color:var(--lo);letter-spacing:.06em;}
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{border:1px dashed var(--line);background:none;border-radius:12px;padding:9px 14px;font-size:13px;color:var(--md);cursor:pointer;}
.chip.on{color:var(--hi);border-style:solid;border-color:var(--hi);}
.chip .chk{font-size:11px;}
.tog{width:40px;height:23px;border-radius:12px;border:1px solid var(--line);background:transparent;position:relative;display:inline-block;flex:0 0 auto;}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--md);transition:transform .22s ease,background .22s;}
.tog.on{border-color:var(--hi);}
.tog.on::after{transform:translateX(17px);background:var(--hi);}
.bigbtn{width:100%;border:1px solid var(--line);background:var(--card);color:var(--hi);border-radius:16px;padding:15px;font-size:15px;letter-spacing:.08em;cursor:pointer;margin-top:10px;}
.bigbtn:active{background:var(--track);}
.seg{display:flex;align-items:flex-start;justify-content:center;gap:clamp(18px,7vw,38px);background:var(--card);border-radius:16px;padding:16px 10px;}
.segcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.seg button{background:none;border:none;cursor:pointer;color:rgba(var(--fg),.68);font-size:15px;line-height:1.2;text-align:center;transition:font-size .22s ease,color .22s ease;padding:2px;}
.seg button.on{color:var(--hi);font-size:20px;font-weight:200;}
.field{padding:8px 0 16px;}
.field>.flabel{font-size:13px;color:var(--md);letter-spacing:.06em;margin-bottom:10px;}
.anno2{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:4px;}
.anno2 .tx{font-size:13px;color:var(--hi);letter-spacing:.05em;font-weight:400;}
.anno2.hide{display:none;}
.picker{display:flex;flex-direction:column;gap:12px;padding:16px 12px;background:var(--card);border-radius:18px;}
.picker .pit{cursor:pointer;font-size:14px;color:rgba(var(--fg),.55);text-align:center;line-height:1.3;transition:font-size .22s ease,color .22s ease;}
.picker .pit.on{color:var(--hi);font-size:20px;}
.picker .pit .pcn{display:block;font-size:11px;color:rgba(var(--fg),.5);letter-spacing:.06em;margin-top:4px;}
.picker .pit.on .pcn{color:var(--md);}
/* SECTION: stats */
.st{margin:10px 0 22px;}
.st .sub{margin-top:8px;}
.st h3{font-size:12px;color:var(--hi);opacity:.8;letter-spacing:.08em;margin:0 0 10px;font-weight:300;}
canvas{display:block;width:100%;}
.ringwrap{position:relative;}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.ringtxt .pv{font-size:32px;font-weight:200;color:var(--hi);}
.ringtxt .pl{font-size:11px;color:var(--md);letter-spacing:.08em;margin-top:3px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px;}
.kpi{background:var(--card);border-radius:16px;padding:14px 12px;}
.kpi .kv{font-size:24px;font-weight:200;color:var(--hi);}
.kpi .kl{font-size:11px;color:var(--lo);letter-spacing:.06em;margin-top:4px;}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.brow .bn{font-size:12px;color:var(--hi);opacity:.82;flex:0 0 112px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow .bt{flex:1 1 auto;height:3px;background:var(--track);border-radius:2px;overflow:hidden;min-width:0;}
.brow .bt i{display:block;height:100%;background:var(--fill);border-radius:2px;width:0;transition:width .7s ease;}
.brow .bv{font-size:11px;color:var(--md);flex:0 0 auto;}
/* SECTION: search */
.mask{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;}
.mask.on{display:flex;}
.sbox{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--track);flex:0 0 auto;}
.sbox input{flex:1 1 auto;min-width:0;font-size:16px;color:var(--hi);}
.sres{padding:14px 20px;border-bottom:1px solid var(--track);cursor:pointer;display:flex;flex-direction:column;gap:4px;}
.sres:active{background:var(--card);}
.sres .w{font-size:19px;font-weight:200;color:var(--hi);letter-spacing:.02em;word-break:break-word;}
.sres .m{font-size:13px;color:var(--lo);line-height:1.5;}
.sres .w em{border-bottom:1px solid var(--hi);}
.sres .m em{border-bottom:1px solid var(--hi);color:var(--hi);}
.empty{padding:56px 20px;text-align:center;color:var(--lo);font-size:14px;line-height:2;}
/* SECTION: modal / prose / toast */
.modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:22px;}
html[data-theme="light"] .modal{background:rgba(0,0,0,.34);}
.modal.on{display:flex;}
.mbox{width:100%;max-width:310px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:20px;}
.mbox h4{margin:0 0 14px;font-size:15px;font-weight:400;letter-spacing:.04em;}
.mbox input{width:100%;border-bottom:1px solid var(--line);padding:8px 2px;font-size:16px;color:var(--hi);}
.avs{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 2px;}
.avs button{width:44px;height:44px;border-radius:50%;border:1px solid transparent;background:var(--card);cursor:pointer;padding:6px;color:var(--md);}
.avs button.on{border-color:var(--hi);color:var(--hi);}
.avs svg{width:100%;height:100%;display:block;}
.mrow{display:flex;gap:12px;margin-top:20px;}
.mrow button{flex:1 1 0;min-width:0;border-radius:14px;padding:12px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--md);}
.mrow button.pri{color:var(--bg);background:var(--hi);border-color:var(--hi);}
html[data-theme="light"] .mrow button.pri{color:#fff;}
html[data-theme="light"] .bigbtn{background:rgba(17,17,19,.82);color:#f4f4f2;border-color:transparent;}
html[data-theme="light"] .bigbtn.ghost{background:none;color:var(--hi);border-color:var(--line);}
.prose{font-size:14px;line-height:2;color:var(--md);}
.prose p{margin:0 0 10px;}
.prose b{color:var(--hi);font-weight:400;}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;max-width:84%;padding:10px 18px;border-radius:14px;border:1px dashed var(--line);background:var(--bg);color:var(--hi);font-size:13px;letter-spacing:.03em;opacity:0;transition:opacity .3s ease;pointer-events:none;text-align:center;line-height:1.6;}
/* SECTION: anno spacing */
.stat .anno .vline,.anno2 .vline{margin-top:7px;}
.stat .anno span,.anno2 .tx{background:var(--bg);padding:0 7px;line-height:1.6;}
/* SECTION: util */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.grow{flex:1 1 auto;min-height:8px;}
.tabnum{font-variant-numeric:tabular-nums;}
#list-ctl input{width:100%;border-bottom:1px dashed var(--line);padding:10px 2px 12px;font-size:16px;color:var(--hi);margin-top:10px;}
#dt-body .def,#dt-body .word{text-align:left;}
#dt-body .center .def,#dt-body .center .word{text-align:center;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- SECTION: screen home -->
  <div class="screen on" id="screen-home">
    <div class="bar">
      <div class="idn">
        <button class="avatar" id="h-av" aria-label="头像"></button>
        <span class="uname" id="h-name">Anthony</span>
      </div>
      <div class="bsearch" id="h-search">
        <span>搜索</span>
        <span class="dotline" style="width:32px"></span>
        <svg class="ic" viewBox="0 0 24 24" width="17" height="17"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
      </div>
    </div>
    <div class="scroll">
      <div class="home" id="home-stats">
        <div class="stat" data-k="target">
          <div class="anno"><span>当前目标总数</span><i class="vline" style="height:30px"></i></div>
          <div class="lbl">Target</div><div class="num tabnum" id="s-target">0</div>
        </div>
        <div class="stat" data-k="learned">
          <div class="anno"><span>已学习单词数</span><i class="vline" style="height:30px"></i></div>
          <div class="lbl">Learned</div><div class="num tabnum" id="s-learned">0</div>
        </div>
        <div class="stat" data-k="rounds">
          <div class="anno"><span>已学习遍数</span><i class="vline" style="height:30px"></i></div>
          <div class="lbl">Rounds</div><div class="num tabnum" id="s-rounds">0</div>
        </div>
        <div class="sub" id="home-sub" style="text-align:center;margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <!-- SECTION: screen stats -->
  <div class="screen" id="screen-stats">
    <div class="bar"><span class="ptitle">数据展示</span><div class="capsule" data-capsule></div></div>
    <div class="scroll" id="stats-body" style="padding:4px 20px 26px;"></div>
  </div>

  <!-- SECTION: screen settings -->
  <div class="screen" id="screen-settings">
    <div class="bar"><span class="ptitle">修改设置</span><div class="capsule" data-capsule></div></div>
    <div class="scroll" id="settings-body" style="padding:4px 20px 26px;"></div>
  </div>

  <!-- SECTION: tabbar -->
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="home"><span class="tt">首页</span><i class="vline"></i>
      <svg class="ic" viewBox="0 0 24 24" width="21" height="21"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>

tries industrialize.","能源消耗随着各国工业化而增加。",3,742,100091,"",""],["microcomputer","n 微型计算机，微机","'maɪkrokəm'pjʊtɚ","microelectronic~[电子] 微电子的|microchip~微型集成电路片，微芯片|microcircuit~[电子] 微电路|microelectronics~微电子学","The merchant sold electrical appliances, such as microcomputer, microphone, microprocessor and microwave ovens.","商人卖一些电器，比如微型计算机，话筒，微处理器和微波炉。",3,743,100091,"",""],["misunderstand","v 误解，误会，曲解",",mɪsʌndɚ'stænd","misunderstood~被误解的|misunderstanding~误解；误会；不和","Rachel, you must have misunderstood her! Ellie would never say something like that.","雷切尔，你一定是误会她了！埃莉绝不会说那样的话。",3,744,100091,"",""],["neighbourhood","n 邻居关系；邻近","nebɚˌhʊd","neighbor~邻近的|neighbour~邻居的；邻近的|neighboring~邻近的；附近的（等于neighbouring）|neighbouring~邻近的；附近的；接壤的|neighborly~睦邻的；友好的；邻居似的|neighbourly~像邻居的；亲切的；睦邻的","a suburban Boston neighbourhood close to where I live.","…离我住处较近的波士顿城郊。",3,745,100091,"",""],["pronunciation","n 发音，发音法","prə,nʌnsɪ'eʃən","pronounced~显著的；断然的；讲出来的|pronounceable~读得出的；可发音的；可断言的|pronounce~发音；作出判断","She gave the word its French pronunciation.","她给出了这个单词的法语发音。",3,746,100091,"",""],["congratulation","n 祝贺；祝贺词","kən,ɡrætʃu'leʃən","congratulatory~祝贺的；庆祝的|congratulate~祝贺；恭喜；庆贺","letters of congratulation","祝贺信",3,747,100098,"",""]]}</script>
<script>
/* SECTION: bootstrap */
"use strict";
(function () {
  var DATA = JSON.parse(document.getElementById("cet4-data").textContent);
  var WORDS = DATA.words, META = DATA.meta;
  var $ = function (id) { return document.getElementById(id); };

  /* SECTION: storage */
  var KEY = ["FREE", "CET4", "v1"].join("_");
  function dflt() {
    return {
      name: "Anthony", av: 0, theme: "dark",
      learned: {},          // id -> 1 学过 / 2 熟悉 / 3 掌握
      fav: {},              // id -> 1
      rounds: 0,
      day: {},              // YYYY-MM-DD -> 当天新学词数
      examLog: {},          // id -> 1 答对 / 0 答错
      plan: { book: 0, mode: "quiz", order: "freq", secs: null, pos: 0 }
    };
  }
  function load() {
    var d = dflt();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return d;
      var o = JSON.parse(raw);
      for (var k in d) if (o[k] !== undefined && o[k] !== null) d[k] = o[k];
      if (!d.plan) d.plan = { book: 0, mode: "quiz", order: "freq", secs: null, pos: 0 };
      if (d.plan.book == null) d.plan.book = 0;
      if (d.plan.mode !== "quiz" && d.plan.mode !== "browse") d.plan.mode = "quiz";
      if (d.plan.order !== "freq" && d.plan.order !== "rand") d.plan.order = "freq";
    } catch (e) { return dflt(); }
    return d;
  }
  var S = load();
  var LS_OK = (function () {
    try {
      localStorage.setItem("__free_probe", "1");
      localStorage.removeItem("__free_probe");
      return true;
    } catch (e) { return false; }
  })();
  var saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      if (!LS_OK) return;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }, 200);
  }

  /* SECTION: helpers */
  function E(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = String(txt);
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function clamp(n, a, b) { return n < a ? a : (n > b ? b : n); }
  function cssv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function svgNode(str) {
    var d = document.createElement("div");
    d.innerHTML = str;                 /* 静态字面量，不含任何动态值 */
    return d.firstChild;
  }
  var ARROW = '<svg class="ic" viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7"/></svg>';
  var toastT = 0;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.style.opacity = "1";
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.style.opacity = "0"; }, 1900);
  }
  function confirmBox(title, body, onYes) {
    var m = $("modal-confirm");
    $("mc-t").textContent = title;
    clear($("mc-b"));
    $("mc-b").appendChild(E("p", null, body));
    m.classList.add("on");
    $("mc-yes").onclick = function () { m.classList.remove("on"); onYes(); };
    $("mc-no").onclick = function () { m.classList.remove("on"); };
  }
  /* 富文本：**加粗** */
  function rich(target, str) {
    String(str).split("**").forEach(function (part, i) {
      if (!part) return;
      if (i % 2) { var b = E("b", null, part); target.appendChild(b); }
      else target.appendChild(document.createTextNode(part));
    });
  }

  /* SECTION: avatars */
  var AVS = [
    '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1"><circle cx="20" cy="20" r="19"/><path d="M20 7 9 32h22z"/><path d="M14.5 24h11"/><text x="20" y="20" font-size="6" text-anchor="middle" fill="currentColor" stroke="none">FREE</text></svg>',
    '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1"><circle cx="20" cy="20" r="19"/><path d="M8 31c0-8 5-14 12-14s12 6 12 14z"/><path d="M20 6v9M13 9l3.5 6M27 9l-3.5 6"/><text x="20" y="26" font-size="5.5" text-anchor="middle" fill="currentColor" stroke="none">FREE</text></svg>',
    '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1"><circle cx="20" cy="20" r="19"/><path d="M7 30a13 13 0 0 1 26 0z"/><path d="M20 17v13M12 24h16"/><text x="20" y="14" font-size="5.5" text-anchor="middle" fill="currentColor" stroke="none">FREE</text></svg>',
    '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="37" height="37" rx="9"/><path d="M13 29V11h14M13 20h11"/></svg>'
  ];

  /* SECTION: data accessors */
  function W(i) { return WORDS[i]; }
  function wname(i) { return W(i)[0]; }
  function wcn(i) { return W(i)[1]; }
  function wph(i) { return W(i)[2]; }
  function wder(i) {
    var s = W(i)[3];
    if (!s) return [];
    return s.split("|").slice(0, 4).map(function (x) {
      var p = x.split("~");
      return [p[0], p[1] || ""];
    });
  }
  function wex(i) { return W(i)[4] || ""; }
  function wexc(i) { return W(i)[5] || ""; }
  function wrex(i) { return W(i)[9] || ""; }
  function wexam(i) {
    var s = W(i)[10];
    if (!s) return null;
    var p = s.split("||");
    if (p.length < 3) return null;
    var opts = (p[1] || "").split("|").filter(function (x) { return x; });
    var right = parseInt(p[2], 10);
    if (!p[0] || opts.length < 3 || isNaN(right)) return null;
    return { q: p[0], opts: opts, right: right, exp: p[3] || "" };
  }
  function escLit(c) {
    return String(c).replace(/[^A-Za-z0-9]/g, function (x) { return "\\" + x; });
  }
  function maskWord(sent, w) {
    var re = new RegExp("\\b" + escLit(w) + "(e?s|d|ed|ing|es|r|st|ly)?\\b", "i");
    return sent.replace(re, function (m) {
      var dots = "";
      for (var k = 1; k < m.length; k++) dots += "·";
      return m.charAt(0) + dots;
    });
  }
  function examPrompt(i) {
    var exq = wexam(i);
    if (exq) {
      var r = { kind: "real", q: exq.q, opts: exq.opts, right: exq.right, exp: exq.exp };
      return r;
    }
    var ds = wder(i);
    if (ds.length) return { kind: "der", items: ds };
    var sent = wex(i) || wrex(i);
    if (sent) return { kind: "cloze", text: maskWord(sent, wname(i)), cn: wexc(i) };
    return { kind: "cn", text: wcn(i) };
  }
  function bookOf(i) { return W(i)[6]; }
  function idxInBook(i) { return W(i)[7]; }
  var BOOK_TOTAL = META.books.map(function (b) { return b[2]; });
  function bookSize(b) { return BOOK_TOTAL[b] || 0; }
  function learnedCount() { return Object.keys(S.learned).length; }
  function favCount() { return Object.keys(S.fav).length; }
  function isFav(i) { return !!S.fav[i]; }

  /* SECTION: plan */
  function curBook() { return S.plan.book; }
  function sectionsOf(book) {
    var n = Math.ceil(bookSize(book) / 333), a = [];
    for (var i = 0; i < n; i++) a.push({ s: i * 333 + 1, e: Math.min((i + 1) * 333, bookSize(book)) });
    return a;
  }
  function sections() { return sectionsOf(curBook()); }
  function selSecs() {
    var all = sections(), sel = S.plan.secs || [];
    var out = sel.filter(function (x) { return x >= 0 && x < all.length; });
    return out.length ? out : [0];
  }
  function target() { return bookSize(curBook()); }
  function learnedInBook() {
    var b = curBook(), n = 0;
    for (var k in S.learned) if (WORDS[k] && WORDS[k][6] === b) n++;
    return n;
  }
  var queueCache = null, queueKey = "";
  function queue() {
    var kk = curBook() + "|" + S.plan.order + "|" + selSecs().join(",");
    if (queueCache && kk === queueKey) return queueCache;
    var all = sections(), sel = selSecs();
    var out = [];
    for (var i = 0; i < WORDS.length; i++) {
      if (WORDS[i][6] !== curBook()) continue;
      var p = WORDS[i][7];
      for (var s = 0; s < sel.length; s++) {
        if (p >= all[sel[s]].s && p <= all[sel[s]].e) { out.push(i); break; }
      }
    }
    if (S.plan.order === "rand") {
      var seed = curBook() * 97 + sel.reduce(function (a, b) { return a + b * 13; }, 7);
      out.sort(function (a, b) { return rnd(a + seed) - rnd(b + seed); });
    } else {
      out.sort(function (a, b) { return W(a)[8] - W(b)[8] || a - b; });
    }
    queueCache = out; queueKey = kk;
    return out;
  }
  function rnd(n) { var x = Math.sin(n) * 10000; return x - Math.floor(x); }

  /* SECTION: navigation */
  var curTab = "home";
  function showTab(t) {
    curTab = t;
    ["home", "stats", "settings"].forEach(function (x) {
      $("screen-" + x).classList.toggle("on", x === t);
    });
    Array.prototype.forEach.call($("tabs").children, function (b) {
      b.classList.toggle("on", b.getAttribute("data-t") === t);
    });
    if (t === "stats") renderStats();
    if (t === "settings") renderSettings();
    renderHome();
  }
  function openPage(id) { closePages(); $(id).classList.add("on"); }
  function closePages() {
    ["page-study", "page-plan", "page-list", "page-detail", "page-text"].forEach(function (p) {
      $(p).classList.remove("on");
    });
    $("mask-search").classList.remove("on");
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function (b) {
    b.addEventListener("click", function () {
      $(b.getAttribute("data-close")).classList.remove("on");
      showTab(curTab);
    });
  });

  /* SECTION: home */
  function renderHome() {
    $("h-name").textContent = S.name;
    var av = $("h-av"); clear(av); av.appendChild(svgNode(AVS[S.av] || AVS[0]));
    $("s-target").textContent = target();
    $("s-learned").textContent = learnedCount();
    $("s-rounds").textContent = S.rounds;
    var b = META.books[curBook()];
    $("home-sub").textContent = b[2] + " " + b[0] + " · " + b[1] + " · 范围 " + selSecs().map(function (i) {
      var a = sections()[i]; return a.s + "–" + a.e;
    }).join(", ");
  }
  /* 说明虚线长度按实际排版测量，保证末端正好落在标签顶部 */
  function resetAnnos() {
    Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (x) {
      x.classList.remove("focus");
      var an = x.querySelector(".anno");
      if (an) an.style.height = "0px";
    });
  }
  function fitAnno(st) {
    var an = st.querySelector(".anno");
    var vl = an.querySelector(".vline");
    var tx = an.querySelector("span");
    var lbl = st.querySelector(".lbl");
    if (!an || !vl || !tx || !lbl) return;
    an.style.height = "auto";
    var top = an.getBoundingClientRect().top;
    var need = lbl.getBoundingClientRect().top - top;
    var th = tx.getBoundingClientRect().height;
    vl.style.height = Math.max(4, Math.min(72, need - th - 10)) + "px";
    an.style.height = Math.max(0, need) + "px";
  }
  Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (st) {
    st.addEventListener("click", function () {
      var was = st.classList.contains("focus");
      resetAnnos();
      if (!was) {
        st.classList.add("focus");
        fitAnno(st);
      }
      $("home-stats").classList.toggle("has-focus", !was);
    });
  });
  $("h-search").addEventListener("click", openSearch);
  $("h-av").addEventListener("click", openProfile);
  $("h-name").addEventListener("click", openProfile);

  /* SECTION: speech */
  var voice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    var vs = window.speechSynthesis.getVoices();
    for (var i = 0; i < vs.length; i++) {
      if (/^en/i.test(vs[i].lang)) { voice = vs[i]; if (vs[i].lang === "en-US") break; }
    }
  }
  if ("speechSynthesis" in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(w) {
    if (!("speechSynthesis" in window)) { toast("当前浏览器不支持语音朗读"); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(w);
      u.lang = voice ? voice.lang : "en-US";
      u.rate = 0.82;
      if (voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    } catch (e) { toast("朗读失败"); }
  }

  /* SECTION: study session */
  var quiz = { q: [], p: 0, mode: "core", revealed: false, answered: null };
  var firstCard = true;
  function curWordId() { return quiz.q[quiz.p]; }
  function openStudy() {
    quiz.q = queue().slice();
    if (!quiz.q.length) { toast("当前范围没有单词"); return; }
    quiz.p = clamp(S.plan.pos || 0, 0, quiz.q.length - 1);
    quiz.mode = S.plan.mode === "quiz" ? "exam" : "core";
    quiz.answered = null;
    openPage("page-study");
    drawCard();
  }
  function drawCard() {
    var i = curWordId();
    if (i == null) return;
    var pr = examPrompt(i);
    var answered = quiz.answered != null;
    var exam = quiz.mode === "exam";
    var hideWord = false;
    $("st-prog").textContent = (quiz.p + 1) + "/" + quiz.q.length;
    $("st-idx").textContent = idxInBook(i);
    $("st-word").textContent = wname(i);
    $("st-phon").textContent = wph(i) ? "/" + wph(i) + "/" : "";
    $("st-def").textContent = wcn(i);
    $("st-mode-lab").textContent = exam ? "考查形式" : "核心释义";
    $("st-word").classList.toggle("dim", hideWord);

    });
    ctx.strokeStyle = cssv("--lo"); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(4, base + .5); ctx.lineTo(w - 4, base + .5); ctx.stroke();
  }

  /* SECTION: capsule + tabs wiring */
  Array.prototype.forEach.call(document.querySelectorAll("[data-capsule]"), function (c) {
    var d1 = E("span", "cap"), d2 = E("span", "cap");
    d1.textContent = "···"; d2.textContent = "◎";
    d2.style.padding = "1px 9px";
    c.appendChild(d1); c.appendChild(d2);
  });
  Array.prototype.forEach.call($("tabs").children, function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-t");
      if (t === "study") { firstCard = true; openStudy(); return; }
      showTab(t);
    });
  });

  /* SECTION: keyboard */
  document.addEventListener("keydown", function (e) {
    if ($("page-study").classList.contains("on")) {
      if (e.key === "ArrowUp" || e.key === " " || e.key === "ArrowRight") { e.preventDefault(); advance(1); }
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); advance(-1); }
      else if (e.key === "s" || e.key === "S") speak(wname(curWordId()));
      else if (e.key === "m" || e.key === "M") toggleMode();
      else if (e.key === "f" || e.key === "F") $("st-fav").click();
      else if (e.key === "Escape") { $("page-study").classList.remove("on"); showTab(curTab); }
      return;
    }
    if (e.key === "Escape") {
      if ($("modal-profile").classList.contains("on")) $("modal-profile").classList.remove("on");
      else if ($("modal-confirm").classList.contains("on")) $("modal-confirm").classList.remove("on");
      else { closePages(); showTab(curTab); }
    }
  });
  var rz;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (curTab === "stats") renderStats(); }, 240);
  });

  /* SECTION: init */
  setTheme(S.theme === "light" ? "light" : "dark");
  showTab("home");
  window.__FREE_DEBUG = {
    S: function () { return S; }, W: W, META: META, queue: queue, target: target,
    learnedCount: learnedCount, bookSize: bookSize, sections: sections,
    openStudy: openStudy, openDetail: openDetail, openList: openList, openPlan: openPlan,
    openText: openText, openSearch: openSearch, speak: speak, showTab: showTab, E: E,
    LS_OK: LS_OK,
    setPlan: function (o) { for (var k in o) S.plan[k] = o[k]; queueCache = null; save(); showTab("home"); }
  };
})();

</script>

    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
